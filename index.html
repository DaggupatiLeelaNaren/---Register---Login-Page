
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="form-container">

            <h1 id="formTitle">Create Account</h1>
            <p class="subtitle" id="formSubtitle">
                Register to get started
            </p>

            <form id="authForm">

                <div class="input-group" id="nameGroup">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <div class="input-group" id="confirmGroup">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                </div>

                <button type="submit" id="submitBtn">Register</button>

            </form>

            <p class="switch-text">
                <span id="switchMessage">Already have an account?</span>
                <a href="#" id="switchBtn">Login</a>
            </p>

            <p id="message"></p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
